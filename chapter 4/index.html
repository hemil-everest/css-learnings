<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta http-equiv="X-UA-Compatible" content="IE=edge">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title> 
    <style>
        .box1{
            /* BYDEFault block */
            /* inline, inline-block, none vs visibility, block. inline-block allows everything
             */
            /* display: inline; */
            /* text align for text within div */
            text-align: center;
            width: 1211px; 
           /* visibility: hidden;  this will not take up space in the document flow */
            height: 114px;
            background-color: red; 
        }
        .box2{ 
            display: inline;
            width: 431px;
            height: 134px;
            background-color: rgb(22, 25, 190);
        }
    </style>
</head>
<body>
    <div class="box1">Lorem ipsum dolor sit, amet consectetur adipisicing elit.</div>
    <div class="box2">Lorem ipsum dolor sit amet consectetur adipisicing elit. </div>
</body>
</html>
